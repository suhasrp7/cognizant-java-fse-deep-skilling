<div style="border:1px solid #ccc;padding:15px;margin:10px;border-radius:8px;">

  <h3>{{ course.title }}</h3>

  <p>{{ course.description }}</p>

  <strong>Instructor:</strong> {{ course.instructor }}

  <br><br>

  <ng-container *ngIf="enrolledCourses$ | async as enrolled">

    <button
      *ngIf="!enrolled.includes(course.id)"
      (click)="enroll()">

      Enroll

    </button>

    <button
      *ngIf="enrolled.includes(course.id)"
      (click)="unenroll()">

      Unenroll

    </button>

  </ng-container>

</div>
